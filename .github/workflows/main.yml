name: main.yml
on:
  push:
    branches: [ lab2 ]
  pull_request:
    branches: [ lab2 ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build + JaCoCo report
        run: ./gradlew --no-daemon clean build jacocoTestReport

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/jacoco
          cp -R build/reports/jacoco/test/html/* site/jacoco/
          # (опционально) простая главная страница
          cat > site/index.html <<'EOF'
          <html>
          <head><meta charset="utf-8"><title>Reports</title></head>
          <body>
           <h1>Reports</h1>
           <ul>
             <li><a href="./jacoco/">JaCoCo coverage report</a></li>
           </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4