name: main.yml
on:
  push:
    branches: [ lab1 ]
  pull_request:
    branches: [ lab2 ]

permissions:
    contents: read

jobs:
    build-and-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "23"
            cache: gradle

        - name: Make gradlew executable
          run: chmod +x gradlew

        - name: Build (includes tests)
          run: ./gradlew --no-daemon clean build
